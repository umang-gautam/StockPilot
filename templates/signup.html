<!DOCTYPE html>
<html>

<head>
    <title>Create Account - StockPilot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

<h1>📝 Create Account</h1>

<form action="/signup" method="POST">

    <input type="text"
           name="shop_name"
           placeholder="Shop Name"
           required>

    <br><br>

    <input type="text"
           name="owner_name"
           placeholder="Owner Name"
           required>

    <br><br>

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <input type="password"
           name="confirm_password"
           placeholder="Confirm Password"
           required>

    <br><br>

    <button type="submit">
        Create Account
    </button>

</form>

<br><br>

<a href="/login">Already have an account? Login</a>

</div>

</body>

</html>
